name: Update and Deploy Site

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes (adjust as needed)
  workflow_dispatch:       # Manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Allows checking out the repository code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main         # Explicitly checkout the 'main' branch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node fetch-articles.js

      - name: List public directory
        run: ls -la public  # Verify contents of the 'public' directory

      - name: Prepare deployment folder
        run: |
          mkdir deploy
          cp public/index.html deploy/
          cp -r public/articles deploy/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v3
        with:
          name: deploy
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Allows pushing changes to repository branches
      pages: write          # Allows updating GitHub Pages
      id-token: write       # Required for authentication
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v3
        with:
          name: deploy
          path: deploy

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # Clone the repository and checkout (or create) the gh-pages branch
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo-gh-pages
          cd repo-gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages
          # Copy only the files you want to update from the deployment folder
          cp -r ../deploy/index.html .
          cp -r ../deploy/articles .
          git add index.html articles
          git commit -m "Deploy updated site to gh-pages branch" || echo "No changes to commit"
          git push origin gh-pages

      - name: Deploy to main branch
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # Clone the repository and checkout the main branch
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo-main
          cd repo-main
          git checkout main
          # Copy the updated files into the repository root
          cp -r ../deploy/index.html .
          cp -r ../deploy/articles .
          git add index.html articles
          git commit -m "Deploy updated site files to main branch" || echo "No changes to commit"
          git push origin main

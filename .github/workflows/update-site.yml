name: Update and Deploy Site

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:       # Manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Allows checking out the repository code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gh-pages         # Explicitly checkout the 'main' branch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node fetch-articles.js

      - name: List public directory
        run: ls -la public  # Verify contents of the 'public' directory

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public     # Uploads the public/ folder as the artifact

  deploy:
    needs: build          # Waits for the build job to complete
    permissions:
      pages: write        # Allows deploying to GitHub Pages
      id-token: write     # Required for authentication
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # Provides the deployed URL
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
